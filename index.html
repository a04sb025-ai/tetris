<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ブラウザですぐ遊べるネオンスタイルのテトリス" />
    <title>NEON BLOCKS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">A LITTLE BREAK FOR YOUR BRAIN</p>
          <h1>NEON <span>BLOCKS</span></h1>
        </div>
        <button class="sound-button" id="soundButton" type="button" aria-label="サウンドのオン・オフ" aria-pressed="true">
          <span class="sound-icon">♪</span><span class="sound-label">SOUND ON</span>
        </button>
      </header>

      <section class="game-shell" aria-label="テトリスゲーム">
        <aside class="panel left-panel">
          <div class="stat featured">
            <span class="label">SCORE</span>
            <strong id="score">000000</strong>
          </div>
          <div class="stat-row">
            <div class="stat"><span class="label">LEVEL</span><strong id="level">01</strong></div>
            <div class="stat"><span class="label">LINES</span><strong id="lines">00</strong></div>
          </div>
          <div class="divider"></div>
          <div class="mini-board">
            <span class="label">HOLD</span>
            <canvas id="hold" width="120" height="96" aria-label="ホールド中のブロック"></canvas>
          </div>
          <div class="desktop-controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd><span>移動</span></li>
              <li><kbd>↑</kbd><span>回転</span></li>
              <li><kbd>↓</kbd><span>ソフトドロップ</span></li>
              <li><kbd>SPACE</kbd><span>ハードドロップ</span></li>
              <li><kbd>C</kbd><span>ホールド</span></li>
            </ul>
          </div>
        </aside>

        <div class="board-wrap">
          <canvas id="board" width="300" height="600" aria-label="ゲーム盤"></canvas>
          <div class="game-overlay" id="overlay">
            <p id="overlayKicker">READY?</p>
            <h2 id="overlayTitle">LET'S PLAY</h2>
            <button id="startButton" type="button">START GAME <span>↗</span></button>
          </div>
        </div>

        <aside class="panel right-panel">
          <div class="mini-board next-board">
            <span class="label">NEXT</span>
            <canvas id="next" width="120" height="300" aria-label="次のブロック"></canvas>
          </div>
          <div class="tip">
            <span>QUICK TIP</span>
            <p>一列そろえるとラインが消えるよ。連続消しでスコアアップ！</p>
          </div>
        </aside>
      </section>

      <section class="touch-controls" aria-label="タッチ操作">
        <button data-action="left" aria-label="左へ移動">←</button>
        <button data-action="rotate" aria-label="回転">↻</button>
        <button data-action="right" aria-label="右へ移動">→</button>
        <button data-action="down" aria-label="下へ移動">↓</button>
        <button class="wide" data-action="drop">DROP</button>
        <button data-action="hold">HOLD</button>
      </section>

      <footer><span>NO DOWNLOAD. NO ADS. JUST PLAY.</span><span>MADE FOR YOUR COFFEE BREAK ☕</span></footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
